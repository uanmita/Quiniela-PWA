<style>
:root {
  --bg: #f5f0e8;
  --surface: #fffcf5;
  --border: #d4c9b8;
  --text: #1a1a1a;
  --muted: #7a7265;
  --gold: #b8972e;
  --gold-light: #e8d48b;
  --navy: #1a2744;
  --navy-light: #2a3f64;
  --red: #c43a31;
  --blue: #2a6fa9;
  --green: #2d8a4e;
  --shadow: rgba(0,0,0,0.08);
  --row-alt: #f8f4ec;
  --badge-bg: #ede7db;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
.dark {
  --bg: #1a1d23;
  --surface: #242830;
  --border: #3a3f4a;
  --text: #e8e6e1;
  --muted: #9a9488;
  --gold: #d4b84a;
  --gold-light: #b8972e;
  --navy: #0f1a30;
  --navy-light: #1a2a4a;
  --row-alt: #2a2e38;
  --badge-bg: #323740;
  --shadow: rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; background:var(--navy); color:white; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:100; gap:12px; }
.header h1 { font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
.header h1 span { color:var(--gold); }
.header-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.header-controls select { padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:white; font-size:13px; font-family:var(--font-body); cursor:pointer; appearance:auto; min-height:40px; }
.header-controls select option { color:var(--text); background:var(--surface); }
.header-controls button { padding:6px 14px; border-radius:6px; background:var(--gold); color:var(--navy); font-weight:600; font-size:13px; font-family:var(--font-body); border:none; cursor:pointer; transition:all .15s; min-height:40px; }
.header-controls button:hover { background:var(--gold-light); transform:translateY(-1px); }
.theme-btn { background:none; border:1px solid rgba(255,255,255,0.3); color:white; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.theme-btn:hover { background:rgba(255,255,255,0.15); }
.container { width:100%; max-width:820px; padding:16px; overflow-x:hidden; }

/* Info bar */
.info-bar { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
.info-bar .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; background:var(--badge-bg); color:var(--text); }
.info-bar .badge.real { background:#2d8a4e20; color:var(--green); }
.info-bar .badge.pred { background:#b8972e20; color:var(--gold); }
.info-bar .badge.aplaz { background:#c43a3120; color:var(--red); }

/* Jornada grid */
.jornada-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:4px; margin-bottom:16px; }
.jornada-btn { padding:6px 0; text-align:center; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:500; cursor:pointer; transition:all .12s; color:var(--text); font-family:var(--font-body); }
.jornada-btn:hover { border-color:var(--gold); transform:translateY(-1px); }
.jornada-btn.active { background:var(--navy); color:white; border-color:var(--navy); }
.jornada-btn.real { background:rgba(45,138,78,0.10); border-color:rgba(45,138,78,0.30); }
.jornada-btn.real:hover { border-color:var(--green); }
.jornada-btn.pred { background:rgba(184,151,46,0.08); border-color:rgba(184,151,46,0.20); }
.jornada-btn.pred:hover { border-color:var(--gold); }
.jornada-btn.aplaz { background:rgba(196,58,49,0.08); border-color:rgba(196,58,49,0.20); }

/* Boleto — scroll on narrow screens */
.boleto { background:var(--surface); border:2px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 4px 24px var(--shadow); }
.boleto-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.boleto-header { background:var(--navy); color:white; padding:16px 20px; text-align:center; border-bottom:2px solid var(--gold); }
.boleto-header h2 { font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:2px; }
.boleto-header h2 span { color:var(--gold); }
.boleto-header .sub { font-size:11px; opacity:.7; margin-top:2px; letter-spacing:1px; }
.boleto-header .jornada-label { background:var(--gold); color:var(--navy); display:inline-block; padding:2px 14px; border-radius:4px; font-size:12px; font-weight:700; margin-top:4px; letter-spacing:0.5px; }

/* Quiniela board table */
.quiniela-board { width:100%; min-width:520px; border-collapse:collapse; font-size:13px; }
.quiniela-board th { background:var(--navy); color:white; padding:8px 10px; font-weight:600; font-size:11px; text-align:center; letter-spacing:0.5px; text-transform:uppercase; }
.quiniela-board th:first-child { width:32px; }
.quiniela-board th:nth-child(2) { text-align:left; }
.quiniela-board th:nth-child(3) { text-align:center; }
.quiniela-board th:nth-child(4) { text-align:right; }
.quiniela-board td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.quiniela-board tr:last-child td { border-bottom:none; }
.quiniela-board tr:nth-child(even) td { background:var(--row-alt); }
.quiniela-board .num { text-align:center; font-weight:600; color:var(--muted); font-size:11px; }
.quiniela-board .local { text-align:right; font-weight:500; white-space:nowrap; }
.quiniela-board .visita { font-weight:500; white-space:nowrap; }
.quiniela-board .score-cell { text-align:center; white-space:nowrap; }
.quiniela-board .score { font-weight:700; font-family:var(--font-mono); font-size:15px; letter-spacing:0.3px; }
.quiniela-board .score-dash { color:var(--muted); padding:0 2px; }
.quiniela-board .sign { display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:5px; font-weight:700; font-size:14px; text-align:center; border:2px solid var(--border); background:var(--surface); margin:0 1px; }
.quiniela-board .sign-col { white-space:nowrap; text-align:center; }
.quiniela-board .sign.w1 { border-color:var(--red); background:var(--red); color:white; }
.quiniela-board .sign.wX { border-color:var(--blue); background:var(--blue); color:white; }
.quiniela-board .sign.w2 { border-color:var(--green); background:var(--green); color:white; }
.quiniela-board .sign.p1 { border-color:rgba(196,58,49,0.40); color:var(--red); background:rgba(196,58,49,0.08); }
.quiniela-board .sign.pX { border-color:rgba(42,111,169,0.40); color:var(--blue); background:rgba(42,111,169,0.08); }
.quiniela-board .sign.p2 { border-color:rgba(45,138,78,0.40); color:var(--green); background:rgba(45,138,78,0.08); }
.quiniela-board .sign.p1.active { border-color:var(--red); background:var(--red); color:white; }
.quiniela-board .sign.pX.active { border-color:var(--blue); background:var(--blue); color:white; }
.quiniela-board .sign.p2.active { border-color:var(--green); background:var(--green); color:white; }
.quiniela-board .pct-row { font-size:10px; color:var(--muted); margin-top:2px; display:flex; gap:4px; justify-content:center; }
.quiniela-board .pct-row span { white-space:nowrap; }
.quiniela-board .conf-cell { width:90px; min-width:80px; text-align:center; }
.quiniela-board .conf-track { width:100%; height:6px; background:var(--badge-bg); border-radius:3px; overflow:hidden; }
.quiniela-board .conf-fill { height:100%; border-radius:3px; transition:width .4s; }
.quiniela-board .conf-fill.high { background:var(--green); }
.quiniela-board .conf-fill.mid { background:#d4a017; }
.quiniela-board .conf-fill.low { background:var(--red); }
.quiniela-board .conf-pct { font-size:10px; color:var(--muted); margin-top:2px; font-weight:500; }
.quiniela-board .aplazado { font-size:11px; color:var(--muted); font-style:italic; }

/* Team dot */
.team-dot { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; flex-shrink:0; }
.team-name { display:inline-flex; align-items:center; gap:6px; }
.team-name.local { justify-content:flex-end; }
.team-name.visit { }

/* Summary */
.summary { display:flex; gap:16px; padding:12px 20px; background:var(--navy); color:white; justify-content:center; font-size:13px; font-weight:500; flex-wrap:wrap; }
.summary span { display:flex; align-items:center; gap:4px; }
.summary .n1 { color:#ff6b6b; }
.summary .nX { color:#6bb5ff; }
.summary .n2 { color:#6bcf8b; }
.summary strong { font-size:16px; }

/* Loading */
.loading { text-align:center; padding:40px; color:var(--muted); }
.loading .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Footer */
.footer { width:100%; max-width:820px; padding:16px; text-align:center; font-size:11px; color:var(--muted); border-top:1px solid var(--border); margin-top:8px; }
.footer a { color:var(--gold); text-decoration:none; }

/* ---- RESPONSIVE ---- */
@media(max-width:600px) {
  body { overflow-x:hidden; }
  .header { padding:8px 10px; flex-wrap:wrap; }
  .header h1 { font-size:14px; }
  .header-controls { gap:4px; }
  .header-controls select { font-size:11px; padding:4px 5px; min-height:34px; max-width:90px; }
  .header-controls button { font-size:11px; padding:4px 8px; min-height:34px; }
  .header-controls input { width:80px !important; font-size:10px !important; }
  .container { padding:6px; max-width:100vw; overflow-x:hidden; }
  .boleto-header { padding:10px 8px; }
  .boleto-header h2 { font-size:15px; }
  .jornada-grid { grid-template-columns:repeat(auto-fill,minmax(32px,1fr)); gap:2px; }
  .jornada-btn { font-size:10px; padding:4px 0; }

  /* El boleto escrolea horizontal si no cabe */
  .boleto { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  .quiniela-board { min-width:460px; font-size:11px; }
  .quiniela-board td, .quiniela-board th { padding:5px 4px; white-space:nowrap; }
  .quiniela-board .num { width:22px; }
  .quiniela-board .sign { width:22px; height:22px; font-size:10px; margin:0; }
  .quiniela-board .score { font-size:12px; }
  .quiniela-board .conf-cell { min-width:55px; }
  .quiniela-board .conf-pct { font-size:9px; }
  .summary { font-size:11px; gap:10px; padding:10px 12px; }
  .summary strong { font-size:14px; }
  .info-bar { font-size:11px; padding:8px 10px; gap:6px; }
}

@media(max-width:380px) {
  .header h1 { font-size:13px; }
  .header-controls { gap:3px; }
  .header-controls select { font-size:10px; padding:3px 4px; min-height:30px; }
  .header-controls button { font-size:10px; padding:3px 6px; min-height:30px; }
  .header-controls input { width:70px !important; font-size:9px !important; }
  .jornada-grid { grid-template-columns:repeat(auto-fill,minmax(30px,1fr)); gap:2px; }
  .jornada-btn { font-size:9px; padding:3px 0; }
  .quiniela-board { min-width:420px; font-size:11px; }
  .quiniela-board td, .quiniela-board th { padding:4px 3px; }
  .quiniela-board .sign { width:22px; height:22px; font-size:10px; }
  .quiniela-board .score { font-size:11px; }
}

@media print {
  .header { position:static; }
  .header-controls, .jornada-grid, .theme-btn, .info-bar .badge, .api-controls { display:none; }
  .boleto { box-shadow:none; border:1px solid #ccc; }
  .boleto-wrapper { overflow-x:visible; }
  .quiniela-board { min-width:0; }
  .dark { --bg:white; --surface:white; --text:black; --border:#ccc; --row-alt:#f9f9f9; }
}
</style>

// ====== GENERADOR DE CALENDARIO (ROUND-ROBIN) ======
function generateFullFixture(teams) {
  const n = teams.length;
  const rounds = n - 1;
  const fixture = {};
  const fixed = teams[0];
  const rotating = teams.slice(1);

  for (let r = 0; r < rounds; r++) {
    const roundMatches = [];
    if (r % 2 === 0) {
      roundMatches.push([fixed, rotating[0]]);
    } else {
      roundMatches.push([rotating[0], fixed]);
    }
    for (let i = 1; i < rounds / 2; i++) {
      const home = rotating[i];
      const away = rotating[rounds - i];
      if ((r + i) % 2 === 0) {
        roundMatches.push([home, away]);
      } else {
        roundMatches.push([away, home]);
      }
    }
    fixture[r + 1] = roundMatches;
    rotating.unshift(rotating.pop());
  }

  for (let r = 0; r < rounds; r++) {
    const returnRound = [];
    const idaRound = fixture[r + 1];
    for (const match of idaRound) {
      returnRound.push([match[1], match[0]]);
    }
    fixture[r + 1 + rounds] = returnRound;
  }
  return fixture;
}

const GENERATED_FIXTURES = {};
for (const season of Object.keys(SEASON_TEAMS)) {
  GENERATED_FIXTURES[season] = generateFullFixture(SEASON_TEAMS[season]);
}

// ====== OBTENER PARTIDOS DE UNA JORNADA ======
function getMatches(season, jNum) {
  if (REAL_DATA[season] && REAL_DATA[season][jNum]) {
    return { matches: REAL_DATA[season][jNum], source: 'real' };
  }
  if (GENERATED_FIXTURES[season] && GENERATED_FIXTURES[season][jNum]) {
    const matches = GENERATED_FIXTURES[season][jNum].map(m => [m[0], "—", "—", m[1]]);
    return { matches, source: 'generated' };
  }
  return null;
}

// ====== POISSON MODEL ======
function calcStats(jornadas) {
  const stats = {};
  const teams = Object.keys(TEAM_COLORS);
  teams.forEach(t => { stats[t] = { gf:0, ga:0, gf_h:0, ga_h:0, gf_a:0, ga_a:0, pj:0, pj_h:0, pj_a:0, pts:0, form:[] }; });
  jornadas.forEach(matches => {
    matches.forEach(m => {
      if(m[1]==="—") return;
      const [local,gL,gV,visit] = m;
      const h = +gL, a = +gV;
      if(stats[local]) {
        stats[local].gf += h; stats[local].ga += a; stats[local].gf_h += h;
        stats[local].ga_h += a; stats[local].pj += 1; stats[local].pj_h += 1;
        stats[local].pts += h>a?3:h===a?1:0;
        stats[local].form.push(h>a?1:h===a?0:-1);
      }
      if(stats[visit]) {
        stats[visit].gf += a; stats[visit].ga += h; stats[visit].gf_a += a;
        stats[visit].ga_a += h; stats[visit].pj += 1; stats[visit].pj_a += 1;
        stats[visit].pts += a>h?3:a===h?1:0;
        stats[visit].form.push(a>h?1:a===h?0:-1);
      }
    });
  });
  return stats;
}

// Fusiona varios stats con pesos (statsArray = [{stats, weight}, ...])
// Cada peso multiplica los contadores; las ratios salen ponderadas naturalmente
function mergeWeightedStats(statsArray) {
  const merged = {};
  const teams = Object.keys(TEAM_COLORS);
  teams.forEach(t => {
    merged[t] = { gf:0, ga:0, gf_h:0, ga_h:0, gf_a:0, ga_a:0, pj:0, pj_h:0, pj_a:0, pts:0, form:[] };
  });

  // Procesar en orden inverso: temporadas más antiguas primero para que
  // las más recientes queden al FINAL del array form (predictMatch usa slice(-5))
  for(let si = statsArray.length - 1; si >= 0; si--) {
    const {stats, weight} = statsArray[si];
    if(!stats || !weight) return;
    teams.forEach(t => {
      if(!stats[t]) return;
      const s = stats[t];
      merged[t].gf += s.gf * weight;
      merged[t].ga += s.ga * weight;
      merged[t].gf_h += s.gf_h * weight;
      merged[t].ga_h += s.ga_h * weight;
      merged[t].gf_a += s.gf_a * weight;
      merged[t].ga_a += s.ga_a * weight;
      merged[t].pj += s.pj * weight;
      merged[t].pj_h += s.pj_h * weight;
      merged[t].pj_a += s.pj_a * weight;
      merged[t].pts += s.pts * weight;
      // Form: copy with weight — positive form entries count more from recent seasons
      for(let i = 0; i < Math.round(weight); i++) {
        merged[t].form.push(...s.form);
      }
      // Fractional part: take proportional slice
      const frac = weight - Math.floor(weight);
      if(frac > 0.01 && s.form.length > 0) {
        const n = Math.round(s.form.length * frac);
        merged[t].form.push(...s.form.slice(-n));
      }
    });
  }
  return merged;
}

function poissonProb(mean, k) {
  // Factorial lookup for k=0..9
  var fact = 1;
  for(var i=2;i<=k;i++) fact *= i;
  return Math.exp(-mean) * Math.pow(mean, k) / fact;
}

function predictMatch(local, visit, stats) {
  const sl = stats[local], sv = stats[visit];
  if(!sl || !sv || sl.pj<2) return { p1:34, pX:32, p2:34, pred:"X", conf:34 };

  let totalGF=0, totalGP=0;
  Object.values(stats).forEach(s => { totalGF += s.gf; totalGP += s.pj; });
  const leagueAvgG = totalGP>0 ? totalGF/totalGP : 2.6;

  const attH = sl.pj_h > 0 ? sl.gf_h / sl.pj_h : leagueAvgG/2;
  const defV = sv.pj_a > 0 ? sv.ga_a / sv.pj_a : leagueAvgG/2;
  const attV = sv.pj_a > 0 ? sv.gf_a / sv.pj_a : leagueAvgG/2;
  const defH = sl.pj_h > 0 ? sl.ga_h / sl.pj_h : leagueAvgG/2;

  const homeAdv = 1.18;
  let gL = ((attH * defV) / (leagueAvgG/2)) * homeAdv * (leagueAvgG/2.6);
  let gV = ((attV * defH) / (leagueAvgG/2)) / homeAdv * (leagueAvgG/2.6);
  gL = Math.max(0.25, Math.min(3.5, gL));
  gV = Math.max(0.2, Math.min(3.0, gV));

  const formL = sl.form.slice(-5).reduce((a,b)=>a+b,0)/Math.max(1,sl.form.slice(-5).length)*0.1;
  const formV = sv.form.slice(-5).reduce((a,b)=>a+b,0)/Math.max(1,sv.form.slice(-5).length)*0.1;
  const gLf = Math.max(0.2, gL + formL);
  const gVf = Math.max(0.2, gV - formV);

  let p1=0, pX=0, p2=0;
  for(let i=0;i<=8;i++) {
    for(let j=0;j<=8;j++) {
      const prob = poissonProb(gLf,i) * poissonProb(gVf,j);
      if(i>j) p1 += prob; else if(i===j) pX += prob; else p2 += prob;
    }
  }
  const total = p1+pX+p2;
  p1 = p1/total*100; pX = pX/total*100; p2 = p2/total*100;

  let pred = "X", conf = 0;
  const maxP = Math.max(p1,pX,p2);
  if(p1===maxP) { pred = "1"; conf = p1; }
  else if(pX===maxP) { pred = "X"; conf = pX; }
  else { pred = "2"; conf = p2; }

  return {
    p1: Math.round(p1*10)/10,
    pX: Math.round(pX*10)/10,
    p2: Math.round(p2*10)/10,
    pred, conf: Math.round(conf*10)/10
  };
}

// ====== FETCH CON TIMEOUT ======
async function fetchWithTimeout(url, apiKey, ms=3000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try {
    const resp = await fetch(url, { headers: { 'X-Auth-Token': apiKey }, signal: ctrl.signal });
    clearTimeout(id);
    if(!resp.ok) return null;
    return await resp.json();
  } catch(e) {
    clearTimeout(id);
    return null;
  }
}

// ====== API FETCH ======
async function fetchFromApi(jNum, season) {
  const apiKey = localStorage.getItem('quinielaApiKey');
  if(!apiKey) return null;
  const data = await fetchWithTimeout('https://api.football-data.org/v4/competitions/PD/matches?matchday=' + jNum + '&season=' + season, apiKey, 4000);
  if(!data || !data.matches || data.matches.length === 0) return null;
  return data.matches.map(function(m) {
    const local = m.homeTeam.name;
    const visit = m.awayTeam.name;
    const hg = m.score && m.score.fullTime ? m.score.fullTime.home : null;
    const ag = m.score && m.score.fullTime ? m.score.fullTime.away : null;
    if(m.status === 'FINISHED' && hg !== null && ag !== null) {
      return [local, String(hg), String(ag), visit];
    }
    return [local, '\u2014', '\u2014', visit];
  });
}

// Descarga jornadas anteriores (máximo 12) en UNA sola tanda paralela
async function fetchPastJornadasFromApi(currentJ, season) {
  const apiKey = localStorage.getItem('quinielaApiKey');
  if(!apiKey) return null;
  const result = {};
  const promises = [];
  for(let j = 1; j < currentJ; j++) {
    promises.push(
      fetchWithTimeout('https://api.football-data.org/v4/competitions/PD/matches?matchday=' + j + '&season=' + season, apiKey, 3000)
        .then(data => ({j, data}))
    );
  }
  if(promises.length === 0) return null;
  const responses = await Promise.all(promises);
  for(const {j, data} of responses) {
    if(!data || !data.matches) continue;
    const matches = data.matches
      .filter(function(m) { return m.status === 'FINISHED' && m.score && m.score.fullTime && m.score.fullTime.home !== null; })
      .map(function(m) { return [m.homeTeam.name, String(m.score.fullTime.home), String(m.score.fullTime.away), m.awayTeam.name]; });
    if(matches.length > 0) result[j] = matches;
  }
  return Object.keys(result).length > 0 ? result : null;
}

// Descarga rápida de temporadas anteriores (una sola tanda paralela por temporada)
async function fetchFullSeasonFromApi(season) {
  const apiKey = localStorage.getItem('quinielaApiKey');
  if(!apiKey) return null;
  const result = {};
  const promises = [];
  for(let j = 1; j <= 38; j++) {
    promises.push(
      fetchWithTimeout('https://api.football-data.org/v4/competitions/PD/matches?matchday=' + j + '&season=' + season, apiKey, 3000)

    );
  }
  const responses = await Promise.all(promises);
  for(const {j, data} of responses) {
    if(!data || !data.matches) continue;
    const matches = data.matches
      .filter(function(m) { return m.status === 'FINISHED' && m.score && m.score.fullTime && m.score.fullTime.home !== null; })

    if(matches.length > 0) result[j] = matches;
  }
  return Object.keys(result).length > 0 ? result : null;
}

async function loadJornada() {
  const season = document.getElementById('seasonSelect').value;
  const jNum = +document.getElementById('jornadaSelect').value;
  const hasApiKey = !!localStorage.getItem('quinielaApiKey');

  document.getElementById('jornadaLabel').textContent = 'JORNADA ' + jNum + ' \u00B7 ' + season + '-' + ((+season+1)%100);
  updateGridClasses();

  const badge = document.querySelector('#infoBar .badge');
  const infoText = document.getElementById('infoText');

  // ═══ 1. MOSTRAR DATOS LOCALES INMEDIATAMENTE ═══
  const local = getMatches(season, jNum);
  if(!local) {
    document.getElementById('boletoBody').innerHTML = '<div class="loading" style="padding:30px">No hay datos disponibles para esta jornada.</div>';
    return;
  }
  const matches = local.matches;
  const localSource = local.source;

  // Cargar jornadas anteriores locales para stats
  let pastJornadas = [];
  for(let j=1; j<jNum; j++) {
    const p = getMatches(season, j);
    if(p) pastJornadas.push(p.matches);
  }
  let stats = pastJornadas.length > 0 ? calcStats(pastJornadas) : {};

  // Renderizar ya (sin esperar a la API)
  const allPlayed = matches.every(m => m[1] !== "—");
  const hasResult = matches[0][1] !== "—";

  if(allPlayed) {
    badge.textContent = localSource === 'real' ? '\u2705 Reales' : '\uD83D\uDCCA Calendario';
    badge.className = 'badge real';
    infoText.textContent = 'Resultados oficiales Jornada ' + jNum + ' \u00B7 LALIGA EA Sports ' + season + '-' + ((+season+1)%100);
    renderPast(matches, jNum);
  } else if(hasResult) {
    badge.textContent = '\u26A0\uFE0F Parcial';
    badge.className = 'badge aplaz';
    infoText.textContent = 'Jornada ' + jNum + ' \u00B7 1 partido aplazado al 09/12';
    renderPast(matches, jNum);
  } else {
    badge.textContent = '\uD83D\uDCCA Pron\u00F3stico';
    badge.className = 'badge pred';
    infoText.textContent = 'Pron\u00F3stico J' + jNum + ' basado en ' + pastJornadas.length + ' jornadas \u00B7 Modelo Poisson';
    renderPrediction(matches, jNum, stats);
  }

  // ═══ 2. EN SEGUNDO PLANO: INTENTAR API PARA MEJORAR ═══
  if(!hasApiKey) return;

  // Mostramos que estamos consultando
  if(!allPlayed) {
    badge.textContent = '\uD83D\uDCE1 Consultando...';
    infoText.textContent = 'Buscando datos reales en football-data.org...';
  }

  const apiMatches = await fetchFromApi(jNum, season);
  if(!apiMatches) {
    // API no respondió o no tiene datos → dejar los locales
    if(!allPlayed) {
      badge.textContent = '\uD83D\uDCCA Pron\u00F3stico';
      badge.className = 'badge pred';
      infoText.textContent = 'Pron\u00F3stico J' + jNum + ' basado en ' + pastJornadas.length + ' jornadas \u00B7 Modelo Poisson';
    }
    return;
  }

  // API respondió: reemplazar matches con los reales
  const apiAllPlayed = apiMatches.every(m => m[1] !== "—");

  if(apiAllPlayed) {
    badge.textContent = '\uD83D\uDCE1 football-data.org';
    badge.className = 'badge real';
    infoText.textContent = 'Resultados reales J' + jNum + ' \u00B7 football-data.org';
    renderPast(apiMatches, jNum);
    return;
  }

  // La jornada actual no está jugada → mejorar stats con datos API
  const apiPast = await fetchPastJornadasFromApi(jNum, season);
  let apiPastJornadas = [];
  if(apiPast) {
    for(let j=1; j<jNum; j++) {
      if(apiPast[j]) apiPastJornadas.push(apiPast[j]);
    }
  }

  // Si hay datos de otras temporadas, intentar multi-temporada
  if(apiPastJornadas.length > 0) {
    let multiStatsParts = [
      { stats: calcStats(apiPastJornadas), weight: 1.5, label: season + '-' + ((+season+1)%100) }
    ];

    const prevSeasons = [];
    if(season === '2026') prevSeasons.push('2025', '2024');
    else if(season === '2025') prevSeasons.push('2024');

    for(const ps of prevSeasons) {
      const psData = await fetchFullSeasonFromApi(ps);
      if(psData) {
        const psJornadas = [];
        for(let j=1; j<=38; j++) {
          if(psData[j]) psJornadas.push(psData[j]);
        }
        if(psJornadas.length > 0) {
          const w = ps === String(+season - 1) ? 0.7 : 0.4;
          multiStatsParts.push({ stats: calcStats(psJornadas), weight: w, label: ps + '-' + ((+ps+1)%100) });
        }
      }
    }

    if(multiStatsParts.length > 1) {
      stats = mergeWeightedStats(multiStatsParts);
      const labels = multiStatsParts.map(p => p.label + ' \u00D7' + p.weight).join(', ');
      badge.textContent = '\uD83D\uDCE1 football-data.org';
      badge.className = 'badge pred';
      infoText.textContent = 'Pron\u00F3stico J' + jNum + ' \u00B7 Multi-temporada (' + labels + ')';
      renderPrediction(apiMatches, jNum, stats);
    } else {
      stats = calcStats(apiPastJornadas);
      badge.textContent = '\uD83D\uDCE1 football-data.org';
      badge.className = 'badge pred';
      infoText.textContent = 'Pron\u00F3stico J' + jNum + ' \u00B7 ' + apiPastJornadas.length + ' jornadas reales';
      renderPrediction(apiMatches, jNum, stats);
    }
  } else {
    // API solo dio la jornada actual, stats siguen siendo locales
    badge.textContent = '\uD83D\uDCE1 football-data.org';
    badge.className = 'badge pred';
    infoText.textContent = 'Pron\u00F3stico J' + jNum + ' \u00B7 Calendario real + stats locales';
    renderPrediction(apiMatches, jNum, stats);
  }
}

function renderPast(matches, jNum) {
  let html = '<table class="quiniela-board"><thead><tr><th>#</th><th>Local</th><th>Resultado</th><th>Visitante</th><th>Signo</th></tr></thead><tbody>';
  let c1=0, cX=0, c2=0;

  matches.forEach((m, i) => {
    const [local, gL, gV, visit] = m;
    const h = +gL, a = +gV;
    let sClass = '', sign = '';
    const played = gL !== "—";

    if(played) {
      if(h>a) { sClass='w1'; sign='1'; c1++; }
      else if(h===a) { sClass='wX'; sign='X'; cX++; }
      else { sClass='w2'; sign='2'; c2++; }
    }

    const lColor = TEAM_COLORS[local] || '#666';
    const vColor = TEAM_COLORS[visit] || '#666';

    html += '<tr>\n      <td class="num">' + (i+1) + '</td>\n      <td class="local"><span class="team-name local"><span class="team-dot" style="background:' + lColor + '"></span>' + local + '</span></td>\n      <td class="score-cell">' + (played ? '<span class="score">' + gL + '</span><span class="score-dash">–</span><span class="score">' + gV + '</span>' : '<span class="aplazado">Aplazado</span>') + '</td>\n      <td class="visita"><span class="team-name visit">' + visit + '<span class="team-dot" style="background:' + vColor + '"></span></span></td>\n      <td class="sign-col">' + (played ? '<span class="sign ' + sClass + '">' + sign + '</span>' : '<span class="aplazado">—</span>') + '</td>\n    </tr>';
  });

  html += '</tbody></table>';
  html += '<div class="summary"><span class="n1">\uD83D\uDD34 1: <strong>' + c1 + '</strong></span><span class="nX">\uD83D\uDD35 X: <strong>' + cX + '</strong></span><span class="n2">\uD83D\uDFE2 2: <strong>' + c2 + '</strong></span></div>';
  document.getElementById('boletoBody').innerHTML = html;
}

function renderPrediction(matches, jNum, stats) {
  let html = '<table class="quiniela-board"><thead><tr><th>#</th><th>Local</th><th>1 | X | 2</th><th>Visitante</th><th>Confianza</th></tr></thead><tbody>';
  let c1=0, cX=0, c2=0;

  matches.forEach((m, i) => {
    const [local, , , visit] = m;
    const pred = predictMatch(local, visit, stats);
    const lColor = TEAM_COLORS[local] || '#666';
    const vColor = TEAM_COLORS[visit] || '#666';

    if(pred.pred==='1') c1++; else if(pred.pred==='X') cX++; else c2++;

    const confClass = pred.conf >= 45 ? 'high' : pred.conf >= 37 ? 'mid' : 'low';
    const confPct = Math.round(pred.conf);
    const fecha = J13_FECHAS[i] || '';

    html += '<tr>\n      <td class="num">' + (i+1) + '</td>\n      <td class="local"><span class="team-name local"><span class="team-dot" style="background:' + lColor + '"></span>' + local + '</span></td>\n      <td class="sign-col">\n        <span class="sign p1 ' + (pred.pred==='1'?'active':'') + '">1</span>\n        <span class="sign pX ' + (pred.pred==='X'?'active':'') + '">X</span>\n        <span class="sign p2 ' + (pred.pred==='2'?'active':'') + '">2</span>\n        <div class="pct-row">\n          <span style="color:var(--red)">' + pred.p1 + '%</span>\n          <span style="color:var(--muted)">\u00B7</span>\n          <span style="color:var(--blue)">' + pred.pX + '%</span>\n          <span style="color:var(--muted)">\u00B7</span>\n          <span style="color:var(--green)">' + pred.p2 + '%</span>\n        </div>\n        <div style="font-size:9px;color:var(--muted);margin-top:1px">' + fecha + '</div>\n      </td>\n      <td class="visita"><span class="team-name visit">' + visit + '<span class="team-dot" style="background:' + vColor + '"></span></span></td>\n      <td class="conf-cell">\n        <div class="conf-track"><div class="conf-fill ' + confClass + '" style="width:' + confPct + '%"></div></div>\n        <div class="conf-pct">' + pred.pred + ' \u00B7 ' + confPct + '%</div>\n      </td>\n    </tr>';
  });

  html += '</tbody></table>';
  html += '<div class="summary"><span class="n1">\uD83D\uDD34 1: <strong>' + c1 + '</strong></span><span class="nX">\uD83D\uDD35 X: <strong>' + cX + '</strong></span><span class="n2">\uD83D\uDFE2 2: <strong>' + c2 + '</strong></span></div>';
  document.getElementById('boletoBody').innerHTML = html;
}

// Init
(function init() {
  const sel = document.getElementById('jornadaSelect');
  for(let j=1;j<=38;j++) {
    const o = document.createElement('option');
    o.value = j; o.textContent = 'Jornada ' + j;
    sel.appendChild(o);
  }
  sel.value = 13;
  buildJornadaGrid();
  loadJornada();

  document.getElementById('seasonSelect').addEventListener('change', function() {
    buildJornadaGrid();
    loadJornada();
  });
})();
</script>
